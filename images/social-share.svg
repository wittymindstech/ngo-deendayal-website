<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">दीन दयाल सेवा भारती</title>
  <desc id="desc">शिक्षा से भविष्य, संस्कारों से व्यक्तित्व</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="1" stop-color="#5B1313"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B0B0B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <path d="M0 0h1200v630H0z" fill="url(#background)"/>
  <path d="M0 0h1200v630H0z" fill="none" stroke="#D4A72C" stroke-width="12"/>
  <circle cx="1080" cy="70" r="180" fill="#D97706" opacity="0.12"/>
  <circle cx="1140" cy="570" r="220" fill="#FDE68A" opacity="0.08"/>

  <rect x="58" y="58" width="440" height="514" rx="28" fill="#FFFDF9" filter="url(#shadow)"/>
  <image x="88" y="83" width="380" height="380" preserveAspectRatio="xMidYMid meet" href="ngo%20logo.webp" xlink:href="ngo%20logo.webp"/>
  <rect x="106" y="488" width="344" height="4" rx="2" fill="url(#accent)"/>
  <text x="280" y="535" text-anchor="middle" fill="#7F1D1D" font-family="Devanagari, Noto Sans Devanagari, sans-serif" font-size="28" font-weight="700">दीन दयाल सेवा भारती</text>

  <g transform="translate(535 145)">
    <rect width="92" height="8" rx="4" fill="#FDE68A"/>
    <text x="0" y="78" fill="#FDE68A" font-family="Devanagari, Noto Sans Devanagari, sans-serif" font-size="30" font-weight="600">शिक्षा और संस्कार</text>
    <text x="0" y="166" fill="#FFFFFF" font-family="Devanagari, Noto Sans Devanagari, sans-serif" font-size="46" font-weight="800">शिक्षा से भविष्य,</text>
    <text x="0" y="230" fill="#FFFFFF" font-family="Devanagari, Noto Sans Devanagari, sans-serif" font-size="46" font-weight="800">संस्कारों से व्यक्तित्व</text>
    <rect x="0" y="286" width="470" height="2" fill="#D4A72C" opacity="0.8"/>
    <text x="0" y="344" fill="#F8F3E8" font-family="Devanagari, Noto Sans Devanagari, sans-serif" font-size="25" font-weight="500">समाज सेवा • शिक्षा • राष्ट्र निर्माण</text>
    <text x="0" y="398" fill="#FDE68A" font-family="Inter, sans-serif" font-size="22" font-weight="600" letter-spacing="1">DEEN DYAAL SEWA BHARTI</text>
  </g>
